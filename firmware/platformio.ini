; Panoptes firmware — ESP32-2432S028R ("Cheap Yellow Display")
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = cyd

[env:cyd]
; pinned so CI and local builds match
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; this board's CH340 corrupts data at 921600 baud
upload_speed = 460800
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
extra_scripts = post:scripts/merge_factory.py

lib_deps =
    lovyan03/LovyanGFX@1.2.30
    bblanchon/ArduinoJson@7.4.3

build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++17
    ; keep the ESP-IDF logger quiet: the UART is our protocol channel
    -DCORE_DEBUG_LEVEL=0
; warnings only for our own sources (not the libraries)
build_src_flags =
    -Wall -Wextra

; Variant with an ILI9341 panel instead of this board's ST7789 (see include/config.h).
;   pio run -e cyd-ili9341 -t upload
[env:cyd-ili9341]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DPANEL_DRIVER=1

; Panel bring-up test (diag/panel_test.cpp): cycles panel configs, tap to pick.
;   pio run -e paneltest -t upload
[env:paneltest]
extends = env:cyd
build_src_filter = -<*> +<../diag/panel_test.cpp>
build_src_flags =
